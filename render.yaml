services:
  - type: web
    name: societyos-api
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run db:generate
    preDeployCommand: npm run db:deploy
    startCommand: npm --workspace @societyos/api run start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: WEB_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: RAZORPAY_ACCOUNT_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_SUBSCRIPTION_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
